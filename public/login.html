<!DOCTYPE html>
<html lang="pt-br">

<head>
    <meta charset="UTF-8">
    <meta http-equiv="X-UA-Compatible" content="IE=edge">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>HollowQuiz | Login</title>

    <script src="./js/sessao.js"></script>

    <link rel="stylesheet" href="./styles/estilo.css">
    <link rel="icon" href="./assets/imgs/hollowmenu.png">
</head>

<body class="pagina-login">

  <header class="header">
        <div class="container">
            <a href="index.html" class="logo">
                <img src="./assets/imgs/HollowQuiz-logo.png" alt="Hollow Knight">
            </a>

            <nav>
                <ul class="navbar">
                    <li><a href="index.html">Início</a></li>
                    <li><a href="quiz.html">Quiz</a></li>
                    <li><a href="dashboard/dashboard.html">Dashboard</a></li>
                    <li class="agora"><a href="login.html" aria-current="page">Login</a></li>
                    <li><a href="cadastro.html">Cadastro</a></li>
                </ul>
            </nav>
        </div>
    </header>


    <div class="login">
        <div class="alerta_erro">
            <div class="card_erro" id="cardErro">
                <span id="mensagem_erro"></span>
            </div>
        </div>
        <div class="container">
            <div class="imagem-acesso">
                <img src="./assets/imgs/hollow-background.jpg" alt="O Cavaleiro em uma caverna de Hallownest">
                <h2>Bem-vindo a Hallownest</h2>
                <p>Entre e continue sua jornada pelo universo de Hollow Knight.</p>
            </div>
            <div class="card">
                <h2>Olá de volta!</h2>
                <img class="ornamento-acesso" src="./assets/ornamentos/dialogo-superior.png" alt="">
                <p class="descricao-acesso">Entre na sua conta para continuar.</p>
                <div class="formulario">
                    <div class="campo">
                        <label for="email_input">E-mail</label>
                        <input id="email_input" type="email" placeholder="Seu e-mail">
                    </div>
                    <div class="campo">
                        <label for="senha_input">Senha</label>
                        <input id="senha_input" type="password" placeholder="******">
                    </div>
                    <button class="botao-quiz" onclick="entrar()">Entrar</button>
                </div>
                <p class="link-acesso">Ainda não tem uma conta? <a href="cadastro.html">Cadastre-se</a></p>

                <div id="div_aguardar" class="loading-div">
                    <img src="./assets/hollowknight-walk.gif" id="loading-gif">
                </div>

                <div id="div_erros_login"></div>
            </div>
        </div>
    </div>

    <div class="footer">
        <div class="container">
            <p>Um tributo ao universo de Hollow Knight.</p>
        </div>
    </div>

<script>


    function entrar() {
        aguardar();
        cardErro.style.display = "none";

        var emailVar = email_input.value.trim();
        var senhaVar = senha_input.value.trim();

        if (emailVar == "" || senhaVar == "") {
            cardErro.style.display = "block"
            mensagem_erro.innerHTML = "Preencha seu e-mail e sua senha.";
            finalizarAguardar();
            setTimeout(sumirMensagem, 5000);
            return false;
        }

        fetch("/usuarios/autenticar", {
            method: "POST",
            headers: {
                "Content-Type": "application/json"
            },
            body: JSON.stringify({
                emailServer: emailVar,
                senhaServer: senhaVar
            })
        }).then(function (resposta) {
            console.log("ESTOU NO THEN DO entrar()!")

            if (resposta.ok) {
                console.log(resposta);

                resposta.json().then(json => {
                    console.log(json);
                    console.log(JSON.stringify(json));
                    sessionStorage.EMAIL_USUARIO = json.infoUsuario;
                    sessionStorage.NOME_USUARIO = json.nome;
                    sessionStorage.ID_USUARIO = json.idUsuario;

                    setTimeout(function () {
                        window.location = "./quiz.html";
                    }, 1000); // apenas para exibir o loading

                });

            } else {

                console.log("Houve um erro ao tentar realizar o login!");

                resposta.text().then(texto => {
                    console.error(texto);
                    finalizarAguardar();
                    cardErro.style.display = "block";
                    mensagem_erro.innerHTML = texto;
                    setTimeout(sumirMensagem, 5000);
                });
            }

        }).catch(function (erro) {
            console.log(erro);
            finalizarAguardar();
            cardErro.style.display = "block";
            mensagem_erro.innerHTML = "Não foi possível conectar. Tente novamente.";
            setTimeout(sumirMensagem, 5000);
        })

        return false;
    }

    function sumirMensagem() {
        cardErro.style.display = "none"
    }

</script>

</body>
</html>
