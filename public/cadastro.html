<!DOCTYPE html>
<html lang="pt-br">
 
<head>
  <meta charset="UTF-8" />
  <meta http-equiv="X-UA-Compatible" content="IE=edge" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
 
  <title>HollowQuiz | Cadastro</title>
 
  <script src="./js/sessao.js"></script>
 
  <link rel="stylesheet" href="./styles/estilo.css" />
  <link rel="icon" href="./assets/icon/favicon2.ico" />
  <link rel="preconnect" href="https://fonts.gstatic.com" />
</head>
 
<body class="pagina-cadastro">
  <header class="header">
    <div class="container">
      <a href="index.html" class="logo">
        <img src="./assets/imgs/HollowQuiz-logo.png" alt="Hollow Knight">
      </a>
 
      <nav>
        <ul class="navbar">
          <li><a href="index.html">Início</a></li>
          <li><a href="quiz.html">Quiz</a></li>
          <li><a href="dashboard/dashboard.html">Dashboard</a></li>
          <li><a href="login.html">Login</a></li>
          <li class="agora"><a href="cadastro.html" aria-current="page">Cadastro</a></li>
        </ul>
      </nav>
    </div>
  </header>
 
  <div class="login">
    <div class="alerta_erro">
      <div class="card_erro" id="cardErro">
        <span id="mensagem_erro"></span>
      </div>
    </div>
    <div class="container">
      <div class="imagem-acesso">
        <img src="./assets/imgs/hornet-cadastro.jpg" alt="Hornet com sua agulha em Hollow Knight: Silksong">
        <h2>Comece sua jornada</h2>
        <p>Crie sua conta e descubra os segredos de Hallownest.</p>
      </div>
      <div class="card">
        <h2>Bem-vindo!</h2>
        <img class="ornamento-acesso" src="./assets/ornamentos/dialogo-superior.png" alt="">
        <p class="descricao-acesso">Preencha seus dados para criar uma conta.</p>
        <div class="formulario">
          <div class="campo">
            <label for="nome_input">Nome</label>
            <input id="nome_input" type="text" placeholder="Seu nome" />
          </div>
          <div class="campo">
            <label for="email_input">E-mail</label>
            <input id="email_input" type="email" placeholder="meuemail@provedor.com" />
          </div>
          <div class="campo">
            <label for="senha_input">Senha</label>
            <input id="senha_input" onkeyup="VerificarSenha()" type="password" placeholder="******" />
          </div>
          <span id="mensagem_senha"></span>
          <div class="campo">
            <label for="confirmacao_senha_input">Confirmação da senha</label>
            <input id="confirmacao_senha_input" type="password" placeholder="******" />
          </div>
          <button class="botao-quiz" onclick="cadastrar()">Cadastrar</button>
        </div>
        <p class="link-acesso">Já tem uma conta? <a href="login.html">Faça login</a></p>
        <div id="div_aguardar" class="loading-div">
          <img src="./assets/circle-loading.gif" id="loading-gif" />
        </div>
 
        <div id="div_erros_login"></div>
      </div>
    </div>
  </div>

  <div class="footer">
    <div class="container">
      <p>Um tributo ao universo de Hollow Knight.</p>
    </div>
  </div>
 
  <script>
    var timerErro;
 
    function mostrarErro(mensagem) {
      cardErro.style.display = "block";
      mensagem_erro.innerHTML = mensagem;
      clearTimeout(timerErro);
      timerErro = setTimeout(sumirMensagem, 5000);
    }
 
    function sumirMensagem() {
      cardErro.style.display = "none";
    }
 
    function limparFormulario() {
      nome_input.value = "";
      email_input.value = "";
      senha_input.value = "";
      confirmacao_senha_input.value = "";
    }
 
    function VerificarSenha() {
      var senha = senha_input.value;
      var especiais = ["!", "@", "#", "$", "%", "&", "*", "?"]; // vetor
      var temMaiuscula = false;
      var temNumero = false;
      var temEspecial = false;
 
      for (var i = 0; i < senha.length; i++) {
        var letra = senha[i];
 
        if (letra >= "A" && letra <= "Z") {
          temMaiuscula = true;
        } else if (letra >= "0" && letra <= "9") {
          temNumero = true;
        } else if (especiais.includes(letra)) {
          temEspecial = true;
        }
      }
 
      var senhaForte = temMaiuscula && temNumero && temEspecial;
 
      if (senha == "") {
        mensagem_senha.innerHTML = "";
      } else if (senhaForte) {
        mensagem_senha.style.color = "#7fdc9b";
        mensagem_senha.innerHTML = "Senha forte!";
      } else {
        mensagem_senha.style.color = "#ff8080";
        mensagem_senha.innerHTML = "Use maiúscula, número e caractere especial.";
      }
 
      return senhaForte;
    }
 
    function cadastrar() {
      var nomeVar = nome_input.value.trim();
      var emailVar = email_input.value.trim();
      var senhaVar = senha_input.value.trim();
      var confirmacaoSenhaVar = confirmacao_senha_input.value.trim();
 
      if (nomeVar == "") {
        mostrarErro("Preencha o campo Nome.");
        return false;
      }
      if (emailVar == "") {
        mostrarErro("Preencha o campo E-mail.");
        return false;
      }
      if (senhaVar == "") {
        mostrarErro("Preencha o campo Senha.");
        return false;
      }
      if (confirmacaoSenhaVar == "") {
        mostrarErro("Confirme a sua senha.");
        return false;
      }
 
      if (nomeVar.length <= 1) {
        mostrarErro("O nome precisa ter mais de 1 caractere.");
        return false;
      }
      if (!emailVar.includes("@") || !emailVar.includes(".")) {
        mostrarErro("O e-mail precisa conter @ e . (ponto).");
        return false;
      }
      if (senhaVar.length < 6) {
        mostrarErro("A senha precisa ter pelo menos 6 caracteres.");
        return false;
      }
      if (!VerificarSenha()) {
        mostrarErro("A senha precisa ter maiúscula, número e caractere especial.");
        return false;
      }
      if (senhaVar != confirmacaoSenhaVar) {
        mostrarErro("A confirmação da senha não confere com a senha.");
        return false;
      }
 
      fetch("/usuarios/cadastrar", {
        method: "POST",
        headers: {
          "Content-Type": "application/json",
        },
        body: JSON.stringify({
          nomeServer: nomeVar,
          emailServer: emailVar,
          senhaServer: senhaVar,
        }),
      })
        .then(function (resposta) {
          console.log("resposta: ", resposta);
 
          if (resposta.ok) {
            mostrarErro("Cadastro realizado com sucesso! Redirecionando para tela de Login...");
 
            setTimeout(function () {
              window.location = "login.html";
            }, 2000);
 
            limparFormulario();
          } else {
            throw "Houve um erro ao tentar realizar o cadastro!";
          }
        })
        .catch(function (erro) {
          console.log("#ERRO: " + erro);
          mostrarErro("Houve um erro ao tentar realizar o cadastro!");
        });
 
      return false;
    }
  </script>
</body>
 
</html>
