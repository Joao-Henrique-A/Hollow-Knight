<!DOCTYPE html>
<html lang="pt-br">
 
<head>
  <meta charset="UTF-8" />
  <meta http-equiv="X-UA-Compatible" content="IE=edge" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
 
  <title>HollowQuiz | Cadastro</title>
 
  <script src="./js/sessao.js"></script>
 
  <link rel="stylesheet" href="./styles/estilo.css" />
  <link rel="icon" href="./assets/icon/favicon2.ico" />
  <link rel="preconnect" href="https://fonts.gstatic.com" />
</head>
 
<body>
  <header class="header">
    <div class="container">
      <a href="#" class="logo">
        <img src="./assets/imgs/HollowQuiz-logo.png" alt="Hollow Knight">
      </a>
 
      <nav>
        <ul class="navbar">
          <li><a href="index.html">Início</a></li>
          <li><a href="index.html">História</a></li>
          <li><a href="index.html">Universo</a></li>
          <li><a href="login.html">Login</a></li>
          <li class="agora"><a href="cadastro.html">Cadastro</a></li>
        </ul>
      </nav>
    </div>
  </header>
 
  <div class="login">
    <div class="alerta_erro">
      <div class="card_erro" id="cardErro">
        <span id="mensagem_erro"></span>
      </div>
    </div>
    <div class="container">
      <div class="card">
        <h2>Bem-vindo!</h2>
        <div class="formulario">
          <div class="campo">
            <span>Nome:</span>
            <input id="nome_input" type="text" placeholder="Seu nome" />
          </div>
          <div class="campo">
            <span>E-mail:</span>
            <input id="email_input" type="text" placeholder="meuemail@provedor.com" />
          </div>
          <div class="campo">
            <span>Senha:</span>
            <input id="senha_input" onkeyup="VerificarSenha()" type="password" placeholder="******" />
          </div>
          <span id="mensagem_senha"></span>
          <div class="campo">
            <span>Confirmação da Senha:</span>
            <input id="confirmacao_senha_input" type="password" placeholder="******" />
          </div>
          <button class="botao" onclick="cadastrar()">Cadastrar</button>
        </div>
        <div id="div_aguardar" class="loading-div">
          <img src="./assets/circle-loading.gif" id="loading-gif" />
        </div>
 
        <div id="div_erros_login"></div>
      </div>
    </div>
  </div>

  <div class="footer">
    <div class="container">
      <h4></h4>
    </div>
  </div>
 
  <script>
    var timerErro;
 
    function mostrarErro(mensagem) {
      cardErro.style.display = "block";
      mensagem_erro.innerHTML = mensagem;
      clearTimeout(timerErro);
      timerErro = setTimeout(sumirMensagem, 5000);
    }
 
    function sumirMensagem() {
      cardErro.style.display = "none";
    }
 
    function limparFormulario() {
      nome_input.value = "";
      email_input.value = "";
      senha_input.value = "";
      confirmacao_senha_input.value = "";
    }
 
    function VerificarSenha() {
      var senha = senha_input.value;
      var especiais = ["!", "@", "#", "$", "%", "&", "*", "?"]; // vetor
      var temMaiuscula = false;
      var temNumero = false;
      var temEspecial = false;
 
      for (var i = 0; i < senha.length; i++) {
        var letra = senha[i];
 
        if (letra >= "A" && letra <= "Z") {
          temMaiuscula = true;
        } else if (letra >= "0" && letra <= "9") {
          temNumero = true;
        } else if (especiais.includes(letra)) {
          temEspecial = true;
        }
      }
 
      var senhaForte = temMaiuscula && temNumero && temEspecial;
 
      if (senha == "") {
        mensagem_senha.innerHTML = "";
      } else if (senhaForte) {
        mensagem_senha.style.color = "#7fdc9b";
        mensagem_senha.innerHTML = "Senha forte!";
      } else {
        mensagem_senha.style.color = "#ff8080";
        mensagem_senha.innerHTML = "Use maiúscula, número e caractere especial.";
      }
 
      return senhaForte;
    }
 
    function cadastrar() {
      var nomeVar = nome_input.value.trim();
      var emailVar = email_input.value.trim();
      var senhaVar = senha_input.value.trim();
      var confirmacaoSenhaVar = confirmacao_senha_input.value.trim();
 
      if (nomeVar == "") {
        mostrarErro("Preencha o campo Nome.");
        return false;
      }
      if (emailVar == "") {
        mostrarErro("Preencha o campo E-mail.");
        return false;
      }
      if (senhaVar == "") {
        mostrarErro("Preencha o campo Senha.");
        return false;
      }
      if (confirmacaoSenhaVar == "") {
        mostrarErro("Confirme a sua senha.");
        return false;
      }
 
      if (nomeVar.length <= 1) {
        mostrarErro("O nome precisa ter mais de 1 caractere.");
        return false;
      }
      if (!emailVar.includes("@") || !emailVar.includes(".")) {
        mostrarErro("O e-mail precisa conter @ e . (ponto).");
        return false;
      }
      if (senhaVar.length < 6) {
        mostrarErro("A senha precisa ter pelo menos 6 caracteres.");
        return false;
      }
      if (!VerificarSenha()) {
        mostrarErro("A senha precisa ter maiúscula, número e caractere especial.");
        return false;
      }
      if (senhaVar != confirmacaoSenhaVar) {
        mostrarErro("A confirmação da senha não confere com a senha.");
        return false;
      }
 
      fetch("/usuarios/cadastrar", {
        method: "POST",
        headers: {
          "Content-Type": "application/json",
        },
        body: JSON.stringify({
          nomeServer: nomeVar,
          emailServer: emailVar,
          senhaServer: senhaVar,
        }),
      })
        .then(function (resposta) {
          console.log("resposta: ", resposta);
 
          if (resposta.ok) {
            mostrarErro("Cadastro realizado com sucesso! Redirecionando para tela de Login...");
 
            setTimeout(function () {
              window.location = "login.html";
            }, 2000);
 
            limparFormulario();
          } else {
            throw "Houve um erro ao tentar realizar o cadastro!";
          }
        })
        .catch(function (erro) {
          console.log("#ERRO: " + erro);
          mostrarErro("Houve um erro ao tentar realizar o cadastro!");
        });
 
      return false;
    }
  </script>
</body>
 
</html>
